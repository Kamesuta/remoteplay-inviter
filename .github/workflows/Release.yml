name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - v*
  # Manual runs build and package without publishing a release:
  #   gh workflow run Release.yml --ref <branch>
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.job.os }}
    defaults:
      run:
        working-directory: client
    strategy:
      matrix:
        job:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: remoteplay-inviter.AppImage
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: remoteplay-inviter-macos-intel.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: remoteplay-inviter-macos.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: remoteplay-inviter-windows.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract crate information
        shell: bash
        run: |
          echo "PROJECT_NAME=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Set crate version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "Detected tag: '$TAG_NAME' -> using version: '$VERSION'"
          cargo install cargo-edit --version 0.12.0
          cargo set-version "$VERSION"

      - name: Install build dependencies
        shell: bash
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-xfixes0-dev

      - name: setup environments
        run: |
          echo "ENDPOINT_URL=${{ secrets.ENDPOINT_URL }}" > .env
          cat .env

      - name: Build
        run: cargo build --release --target ${{ matrix.job.target }}

      - name: Build AppImage
        uses: AppImageCrafters/build-appimage-action@master
        if: runner.os == 'Linux'
        env:
          SOURCE_DIR: client
          BUILD_DIR: client/target/${{ matrix.job.target }}/release
          EXECUTABLE_PATH: client/target/${{ matrix.job.target }}/release/${{ env.PROJECT_NAME }}
          UPDATE_INFO: gh-releases-zsync|${{ env.GITHUB_REPOSITORY_OWNER }}|${{ env.PROJECT_NAME }}|latest|*.AppImage.zsync
          OUTPUT_NAME: ${{ matrix.job.artifact }}
        with:
          recipe: client/AppImageBuilder.yml

      # Packages are written to the repository root, where the AppImage action puts its output
      # The Steamworks runtime library must sit next to the executable
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          tar -czvf ../${{ matrix.job.artifact }} -C target/${{ matrix.job.target }}/release ${{ env.PROJECT_NAME }} libsteam_api.dylib

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.job.target }}/release/${{ env.PROJECT_NAME }}.exe, target/${{ matrix.job.target }}/release/steam_api64.dll -DestinationPath ../${{ matrix.job.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.job.artifact }}
          path: ${{ matrix.job.artifact }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            ${{ matrix.job.artifact }}
